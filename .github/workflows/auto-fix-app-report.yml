name: auto-fix-app-report

# Event-driven sibling of the hourly cron routine: the moment an in-app report
# lands (the server stamps the `app-report` label), run Claude Code to reproduce
# + TDD-fix it and open an auto-merge PR. Claude Code authenticates with a
# subscription OAuth token (CLAUDE_CODE_OAUTH_TOKEN) — no API-token spend.
#
# Secrets (repo-level on bg9m9r/majik):
#   CLAUDE_CODE_OAUTH_TOKEN  — `claude setup-token`, bills the Claude subscription.
#   AUTOFIX_GH_PAT           — a real user PAT so the agent's PR TRIGGERS build-test
#                              (PRs opened with the default GITHUB_TOKEN do not),
#                              and so it can work cross-repo into majik.portal.

on:
  issues:
    types: [labeled]

# At most one run per issue; a re-label won't stack a second run.
concurrency:
  group: auto-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    # Only fire on the app-report label, and never on an already-claimed /
    # parked issue (the cron backstop + this Action share the wip claim-CAS).
    if: >-
      github.event.label.name == 'app-report'
      && !contains(toJson(github.event.issue.labels.*.name), 'app-report:wip')
      && !contains(toJson(github.event.issue.labels.*.name), 'needs-human')
      && !contains(toJson(github.event.issue.labels.*.name), 'report-pause')
    runs-on: self-hosted
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_GH_PAT }}

      - name: Auto-fix the report
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AUTOFIX_GH_PAT }}
          prompt: |
            You are the Majik auto-fix agent, running on a self-hosted runner that
            has the .NET 10 SDK + node/npm. Fix EXACTLY ONE issue:
            bg9m9r/majik issue #${{ github.event.issue.number }}
            ("${{ github.event.issue.title }}"). `gh` is authed (it can reach
            bg9m9r/majik AND bg9m9r/majik.portal). Be idempotent; it is safe to no-op.

            ## 1. Claim (idempotent CAS)
            - `gh issue view ${{ github.event.issue.number }} --repo bg9m9r/majik --json labels,state`.
            - If the issue is CLOSED, or carries `app-report:wip` / `needs-human` /
              `report-pause` — STOP, do nothing (another run/the cron has it).
            - Else claim it: `gh issue edit ${{ github.event.issue.number }} --repo bg9m9r/majik --add-label app-report:wip`,
              then re-read and confirm the label stuck before doing any work.

            ## 2. Reproduce + diagnose
            - Read the issue body; parse the inline `<details>` JSON bundle
              (match/game id, seed, replay event stream, full-reveal state, client
              telemetry) and the human description.
            - Work in a fresh git worktree off `origin/main` of the repo the fix
              belongs to: replay/state/engine signals => bg9m9r/majik (majik.core,
              build/test `dotnet build Majik.sln` / `dotnet test`); console /
              SignalR-only client desync => bg9m9r/majik.portal (clone via gh; `npm ci`
              + `ng test --no-watch` + `npm run build`). Find the ROOT CAUSE first;
              prefer a deterministic reproduction from the bundle's seed + events.

            ## 3. Fix — TDD, MANDATORY
            - Write a FAILING regression test first, then the minimal fix, then green
              (run the FULL relevant suite to a clean exit, not a filtered subset).
            - If you CANNOT root-cause AND produce a passing regression test: comment
              your diagnosis + suspected root cause on the issue, add `needs-human`,
              remove `app-report:wip`, and STOP. Do NOT open a speculative PR.

            ## 4. Scope fence (HARD)
            - Touch ONLY gameplay code: `Majik.Core*` / `Majik.Server` engine+match
              code, or portal `src/`. NEVER edit `.github/`, CI workflows, render.yaml,
              Dockerfiles, secrets, auth/deploy config, `.claude/`. If a fix would need
              any of those, stop => comment + `needs-human` + remove `wip`.

            ## 5. Ship
            - Commit DCO-signed (`git commit -s`), Conventional Commit, end the body with
              `Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>`.
            - Open a PR (use the authed `gh`; the token is a PAT so build-test runs).
              The PR body MUST include `Closes #${{ github.event.issue.number }}`
              (or `Closes bg9m9r/majik#${{ github.event.issue.number }}` for a portal-repo
              PR) and end with `Generated with [Claude Code](https://claude.com/claude-code)`.
            - `gh pr merge <n> --auto --squash`. CI (`build-test` + `dco`) gates the merge
              — NEVER force-merge. Leave `app-report:wip` on; the merge closes the issue
              (the fix-live webhook reads the close and notifies the reporter).
            - If the PR can't auto-merge (CI red after a reasonable attempt): comment why,
              add `needs-human`, remove `app-report:wip`.
          claude_args: "--max-turns 80"
