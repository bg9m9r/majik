name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  build-test:
    # Always GitHub-hosted. The former dual-pool routing sent every even-numbered run to
    # self-hosted runners; when those are offline the job is never picked up and is
    # cancelled after 24 hours, which blocks merging (#3567). Hosted runners are free for
    # this public repository. Reintroduce a self-hosted pool only with an availability check.
    runs-on: ubuntu-latest
    # The last hosted run took 5 min 33 s before the target-filter scanner and full-game gate
    # steps (about 15 s and 9 s on a 16-core machine; allow a minute or two on a hosted runner).
    # 12 minutes leaves room while still failing fast on a hang.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Majik.sln

      - name: Build
        run: dotnet build Majik.sln --no-restore --configuration Release

      - name: Test
        # Run each test assembly SEQUENTIALLY rather than `dotnet test Majik.sln`
        # (which runs all projects in PARALLEL). On CI's low core count the
        # parallel run intermittently deadlocked — silently hanging to the
        # timeout and ejecting unrelated PRs — a classic sync-over-async
        # thread-pool starvation that never reproduces on a 16-core dev box.
        # Each assembly alone is <35s, so sequential costs ~1-2 min wall-clock
        # but is deterministic. Majik.Bot.Tests.Integration is omitted from the
        # required gate: supplementary bot-vs-bot / SignalR smoke (mostly
        # [Skip]-ed per CLAUDE.md) + the same flake class #1731 quarantined.
        run: |
          set -e
          echo "::group::test Majik.Core.Tests"
          dotnet test Majik.Core.Tests/Majik.Core.Tests.csproj --no-build --configuration Release --verbosity normal --filter "Category!=Scanner"
          echo "::endgroup::"
          for proj in Majik.Core.Api.Tests Majik.Server.Tests; do
            echo "::group::test $proj"
            dotnet test "$proj/$proj.csproj" --no-build --configuration Release --verbosity normal
            echo "::endgroup::"
          done
          echo "::group::test Majik.Bot.Tests"
          dotnet test Majik.Bot.Tests/Majik.Bot.Tests.csproj --no-build --configuration Release --verbosity normal --filter "Category!=FullGameGate"
          echo "::endgroup::"

      - name: Target-filter scanner
        # CR 115.1 / 601.2c — every template-bound target request in the
        # embedded pool against its oracle phrase; fails on a mismatch not on
        # the shrink-only allow-list in
        # Majik.Core.Tests/CardData/SpellTemplates/TemplateTargetFilterAllowList.cs
        # or on a listed one that no longer occurs. Its own step so the
        # mismatch table (detailed logger) is readable in the log.
        run: dotnet test Majik.Core.Tests/Majik.Core.Tests.csproj --no-build --configuration Release --filter "Category=Scanner" --logger "console;verbosity=detailed"

      - name: Full-game gate
        # #3543 — every ordered BotDeckCatalog archetype pair x 2 seeds,
        # heuristic bot on both seats, turn cap 30, in parallel shards (~7s on
        # 16 cores). Fails on a fault / zone-desync signature not on the
        # allow-list in Majik.Bot.Tests/FullGameGate/FullGameGateTests.cs, or on
        # a listed one that no longer occurs. Its own step so the signature
        # table (detailed logger) is readable in the log.
        run: dotnet test Majik.Bot.Tests/Majik.Bot.Tests.csproj --no-build --configuration Release --filter "Category=FullGameGate" --logger "console;verbosity=detailed"
