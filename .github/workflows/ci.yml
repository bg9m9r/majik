name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12  # healthy run is ~3min; fail fast so a flaky hang frees the runner instead of hogging it

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        # On self-hosted runners setup-dotnet defaults to /usr/share/dotnet,
        # which the unprivileged runner user can't write. Install into the
        # runner tool cache (a shared Docker volume): writable, and persisted
        # between jobs so the SDK is downloaded only once. setup-dotnet adds
        # this dir to PATH for the later dotnet steps. (runner.* context is
        # only available at step scope, not in a job-level env.)
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Majik.sln

      - name: Build
        run: dotnet build Majik.sln --no-restore --configuration Release

      - name: Test
        # Exclude Majik.Bot.Tests.Integration from the required gate: it is
        # supplementary bot-vs-bot / SignalR-hub smoke (mostly [Skip]-ed per
        # CLAUDE.md) and is intermittently flaky AND prone to a CI-only
        # thread-pool-starvation deadlock that silently hangs the whole
        # `dotnet test Majik.sln` run to the timeout — ejecting unrelated PRs
        # (the same class of flake #1731 quarantined VanillaShellGracefulDegrade
        # for). The engine/server unit suites (Core, Core.Api, Server, Bot)
        # remain the required coverage. Run the integration smoke separately if
        # desired; it must not gate merges.
        run: dotnet test Majik.sln --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Majik.Bot.Tests.Integration"
