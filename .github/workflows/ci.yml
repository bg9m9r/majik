name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  build-test:
    runs-on: self-hosted

    # On self-hosted runners setup-dotnet defaults to /usr/share/dotnet, which
    # the unprivileged runner user can't write. Point it at the runner tool
    # cache: writable on both hosted + self-hosted, and persisted between jobs
    # so the SDK is downloaded only once.
    env:
      DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Majik.sln

      - name: Build
        run: dotnet build Majik.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Majik.sln --no-build --configuration Release --verbosity normal
