name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12  # healthy run is ~3min; fail fast so a flaky hang frees the runner instead of hogging it

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        # On self-hosted runners setup-dotnet defaults to /usr/share/dotnet,
        # which the unprivileged runner user can't write. Install into the
        # runner tool cache (a shared Docker volume): writable, and persisted
        # between jobs so the SDK is downloaded only once. setup-dotnet adds
        # this dir to PATH for the later dotnet steps. (runner.* context is
        # only available at step scope, not in a job-level env.)
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Majik.sln

      - name: Build
        run: dotnet build Majik.sln --no-restore --configuration Release

      - name: Test
        # Run each test assembly SEQUENTIALLY rather than `dotnet test Majik.sln`
        # (which runs all projects in PARALLEL). On CI's low core count the
        # parallel run intermittently deadlocked — silently hanging to the
        # timeout and ejecting unrelated PRs — a classic sync-over-async
        # thread-pool starvation that never reproduces on a 16-core dev box.
        # Each assembly alone is <35s, so sequential costs ~1-2 min wall-clock
        # but is deterministic. Majik.Bot.Tests.Integration is omitted from the
        # required gate: supplementary bot-vs-bot / SignalR smoke (mostly
        # [Skip]-ed per CLAUDE.md) + the same flake class #1731 quarantined.
        run: |
          set -e
          for proj in Majik.Core.Tests Majik.Core.Api.Tests Majik.Server.Tests Majik.Bot.Tests; do
            echo "::group::test $proj"
            dotnet test "$proj/$proj.csproj" --no-build --configuration Release --verbosity normal
            echo "::endgroup::"
          done
