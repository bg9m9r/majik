# Render Blueprint — Majik backend (API + Cards + MongoDB)
# Deploy: connect this repo (github.com/bg9m9r/majik) as a Blueprint on Render.
#
# Secrets to set after first sync (Render dashboard or REST API):
#   majik-api:
#     Auth__Authority           e.g. https://api.descope.com/<DESCOPE_PROJECT_ID>
#     Auth__Audience            <DESCOPE_PROJECT_ID>
#     Mongo__ConnectionString   mongodb://<user>:<pass>@majik-mongo:27017/?authSource=admin
#     Cors__AllowedOrigins__0   https://majik-portal.onrender.com  (or custom domain)
#     Cards__BaseUrl            http://majik-cards:10000           (intra-Render DNS)
#     Cards__InternalToken      must match majik-cards' Cards__InternalToken
#   majik-cards:
#     Cards__InternalToken      shared secret with majik-api (any high-entropy string)
#   majik-mongo:
#     MONGO_INITDB_ROOT_USERNAME  pick one (e.g. majik)
#     MONGO_INITDB_ROOT_PASSWORD  auto-generated below
#
# Cards-extraction rollout status: majik-cards owns the SQLite disk, majik-api
# is diskless and talks to it over HTTP. The old SQLite fallback path in
# MajikEngineRegistration still exists in code (kicks in when Cards:BaseUrl is
# unset), but in prod it never runs because the env var is always set.

services:
  - type: web
    name: majik-api
    runtime: docker
    # Standard required to scale numInstances > 1 later (the Redis-backplane
    # PR enables that). Also gives headroom for in-process GameFacade state +
    # SignalR connections; Starter's 512 MB is borderline above ~10 concurrent
    # games.
    plan: standard
    region: oregon
    rootDir: .
    dockerfilePath: ./Majik.Server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    # No `disk:` — majik-api is fully diskless after the cards extraction.
    # Card lookups happen over HTTP via Cards__BaseUrl. Removing the disk is
    # what unblocks horizontal scaling (Render disks are single-instance).
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Mongo__Database
        value: majik
      - key: Auth__Authority
        sync: false
      - key: Auth__Audience
        sync: false
      - key: Mongo__ConnectionString
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Cards__BaseUrl
        sync: false
      - key: Cards__InternalToken
        sync: false

  - type: pserv
    name: majik-cards
    runtime: docker
    plan: starter
    region: oregon
    rootDir: .
    dockerfilePath: ./Majik.CardsServer/Dockerfile
    dockerContext: .
    autoDeploy: true
    disk:
      # Owns the SQLite cards.db file. Single-instance by Render policy; this
      # is fine because reads are cacheable on the majik-api side via the
      # in-process CachingCardRepository decorator.
      name: cards-server-data
      mountPath: /root/.config/Majik
      sizeGB: 2
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: CARDS_SEED_TAG
        # Bump to a new release tag to trigger a fresh download on next deploy.
        value: cards-seed-2026-05-21
      - key: Cards__InternalToken
        sync: false

  - type: pserv
    name: majik-mongo
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/library/mongo:7
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 10
    envVars:
      - key: MONGO_INITDB_ROOT_USERNAME
        sync: false
      - key: MONGO_INITDB_ROOT_PASSWORD
        generateValue: true
