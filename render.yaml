# Render Blueprint — Majik backend (API + MongoDB)
# Deploy: connect this repo (github.com/bg9m9r/majik) as a Blueprint on Render.
#
# Secrets to set after first sync (Render dashboard or REST API):
#   majik-api:
#     Auth__Authority           e.g. https://api.descope.com/<DESCOPE_PROJECT_ID>
#     Auth__Audience            <DESCOPE_PROJECT_ID>
#     Mongo__ConnectionString   mongodb://<user>:<pass>@majik-mongo:27017/?authSource=admin
#     Cors__AllowedOrigins__0   https://majik-portal.onrender.com  (or custom domain)
#   majik-mongo:
#     MONGO_INITDB_ROOT_USERNAME  pick one (e.g. majik)
#     MONGO_INITDB_ROOT_PASSWORD  auto-generated below
#
# Card data: bundled in-process via EmbeddedCardRepository (gzipped
# modern-cards.json.gz baked into the Majik.Core assembly). No separate
# cards service, no persistent disk for cards.

services:
  - type: web
    name: majik-api
    runtime: docker
    # Standard required to scale numInstances > 1 later (the Redis-backplane
    # PR enables that). Also gives headroom for in-process GameFacade state +
    # SignalR connections; Starter's 512 MB is borderline above ~10 concurrent
    # games.
    plan: standard
    region: oregon
    rootDir: .
    dockerfilePath: ./Majik.Server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # autoDeploy intentionally omitted — manage deploys manually in the Render
    # dashboard. Constant auto-deploys made prod validation impractical; flip
    # back to `autoDeploy: true` when iteration cadence calms down.
    # No `disk:` — card lookups are in-process via the embedded
    # modern-cards.json.gz resource. No filesystem dependency, no internal
    # HTTP hop, safe to scale horizontally.
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Mongo__Database
        value: majik
      - key: Auth__Authority
        sync: false
      - key: Auth__Audience
        sync: false
      - key: Mongo__ConnectionString
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false

  - type: pserv
    name: majik-mongo
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/library/mongo:8
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 10
    envVars:
      - key: MONGO_INITDB_ROOT_USERNAME
        sync: false
      - key: MONGO_INITDB_ROOT_PASSWORD
        generateValue: true
